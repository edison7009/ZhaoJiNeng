name: Sync skills catalogue

# Manual-only: the skills catalogue is treated as fixed content, so it is NOT
# refreshed on a schedule. Run via the Actions tab ("Run workflow") when the
# skills data actually needs regenerating. Only the LLM leaderboard
# (sync-models.yml) auto-updates.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh skills catalogue + paginate + mirror to EN site
        run: python sync.py skills

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # skills.json + whichclaw/public/skills.json are sync intermediates;
          # they exceed Cloudflare Pages' 25 MiB file limit at 70K+ rows so
          # they are gitignored. Only the paginated artefacts get committed.
          git add public/featured.json public/skills_pages \
                  whichclaw/public/featured.json \
                  whichclaw/public/skills_pages
          if git diff --staged --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "data: auto-sync skills catalogue $(date -u +'%Y-%m-%d %H:%MZ')"
          git push origin main
